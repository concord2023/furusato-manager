<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寄附・配送</title><link rel="stylesheet" href="style.css"></head><body><header><div><a href="index.html" class="back">← ホーム</a><strong>寄附・配送</strong></div></header><main><section class="hero compact"><div class="eyebrow">2026年</div><h1 id="donationTotal">—</h1><p>同一注文を複数メールで受信しても、注文ID等で1件にまとめる設計です。</p></section><section class="card"><h2>寄附一覧</h2><div id="donationList"></div><button id="addDonation">＋ 寄附を手動追加</button></section><section class="card"><h2>配送状況</h2><div id="deliveryList"></div></section><section class="card warn"><h2>確認待ち</h2><div id="pending"></div></section><nav><a href="index.html">ホーム</a><a href="details.html">上限詳細</a><a class="active" href="donations.html">寄附・配送</a><a href="settings.html">設定</a></nav></main><script src="data-model.js"></script><script src="calculator.js"></script><script src="integration.js"></script><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const yen=n=>new Intl.NumberFormat('ja-JP').format(Math.round(n))+'円';const list=document.getElementById('donationList');const render=()=>{const all=state.donations||[];const confirmed=all.filter(x=>x.status!=='確認待ち');document.getElementById('donationTotal').textContent='寄附済み '+yen(confirmed.reduce((a,x)=>a+x.amount,0));list.innerHTML=all.map(x=>`<div class="row"><span>${x.site}｜${x.city}｜${x.item}<br><small>${x.status==='確認待ち'?'⚠️ 確認待ち':'自動取得候補'}</small></span><strong>${yen(x.amount)}</strong></div>`).join('');document.getElementById('deliveryList').innerHTML=all.map(x=>`<div class="row"><span>${x.item}・${x.city}</span><em class="${x.status==='確認待ち'?'':'ok'}">${x.delivery}</em></div>`).join('');document.getElementById('pending').innerHTML=all.filter(x=>x.status==='確認待ち').map(x=>`<p>${x.site}｜${x.item}｜${yen(x.amount)} <button onclick="confirmDonation('${x.id}')">確定</button></p>`).join('')||'<p>確認待ちはありません。</p>'};window.confirmDonation=id=>{const x=state.donations.find(x=>x.id===id);if(x){x.status='確定';save(state);render()}};document.getElementById('addDonation').onclick=()=>{const amount=Number(prompt('寄附額（円）'));if(!Number.isFinite(amount)||amount<=0)return;state.donations.push({id:'m'+Date.now(),site:'手動',city:'未入力',item:'手動登録',amount:amount,status:'確定',delivery:'未定'});save(state);render()};render()});</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js?build=20260920-v17').catch(()=>{});</script></body></html>
