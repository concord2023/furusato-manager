<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ふるさと納税アプリ 設定</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;margin:0;background:#f3f4f6;color:#111827}
.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
h1{font-size:22px;margin:0 0 8px}h2{font-size:18px;margin:0 0 10px}.muted{color:#6b7280;font-size:13px;line-height:1.5}
input,button{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid #d1d5db;box-sizing:border-box}
input{width:100%;margin:6px 0 10px}button{background:#111827;color:white;border:0;margin:4px 4px 4px 0}button:disabled{opacity:.45}
.status{padding:10px;border-radius:10px;background:#f3f4f6;white-space:pre-wrap;word-break:break-word}.ok{background:#ecfdf5}.warn{background:#fffbeb}.bad{background:#fef2f2}
pre{white-space:pre-wrap;word-break:break-word;background:#111827;color:#f9fafb;border-radius:10px;padding:12px;font-size:12px;max-height:420px;overflow:auto}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;min-width:130px}
</style></head>
<body><main class="wrap">
<h1>⚙️ ふるさと納税アプリ 設定</h1>
<p class="muted">Google Driveから給与・賞与・源泉徴収票PDFを取得し、現在のデータへ取り込みます。Client IDはブラウザのlocalStorageにのみ保存します。</p>

<section class="card"><h2>Google Drive</h2>
<label>Google OAuth Client ID</label><input id="googleClientId" autocomplete="off" placeholder="xxxx.apps.googleusercontent.com">
<div class="row"><button id="googleSaveClient">Client IDを保存</button><button id="googleConnect">Google Driveに接続</button><button id="googleDisconnect">接続解除</button></div>
<div id="googleStatus" class="status">未接続</div>
</section>

<section class="card"><h2>PDF自動取り込み</h2>
<p class="muted">ファイル名から給与・賞与・源泉徴収票を候補化し、PDF文字レイヤーを優先。文字レイヤーが不足する場合はOCRを複数条件で試します。</p>
<button id="googleScan">給与・賞与・源泉徴収PDFを検索して取り込む</button>
<div id="scanStatus" class="status">待機中</div>
</section>

<section class="card"><h2>取り込み結果</h2><pre id="result">まだ実行していません。</pre></section>
<section class="card"><h2>OCR画像</h2><button id="exportOcrImage">最後のOCR画像PNG保存</button><div id="ocrStatus" class="muted">画像なし</div></section>
</main>
<script src="./integration.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const stateKey='furusatoState';
  const state=()=>{try{return JSON.parse(localStorage.getItem(stateKey)||'{}')}catch{return {}}};
  const save=s=>localStorage.setItem(stateKey,JSON.stringify(s));
  const setStatus=(el,text,kind='')=>{el.textContent=text;el.className='status '+kind};
  const refresh=()=>{
    $('googleClientId').value=FurusatoGoogleDrive.getClientId();
    const has=!!FurusatoGoogleDrive.getClientId();
    $('googleStatus').textContent=has?'Client ID保存済み。接続は未実行。':'Client ID未設定。';
    $('googleScan').disabled=!has;
  };
  $('googleSaveClient').addEventListener('click',()=>{
    const id=FurusatoGoogleDrive.setClientId($('googleClientId').value);
    setStatus($('googleStatus'),id?'Client IDを保存しました。Google Drive接続を実行してください。':'Client IDを削除しました。',id?'ok':'warn');
    refresh();
  });
  $('googleConnect').addEventListener('click',async()=>{
    try{await FurusatoGoogleDrive.authorize();setStatus($('googleStatus'),'Google Driveに接続しました。','ok');$('googleScan').disabled=false}
    catch(e){setStatus($('googleStatus'),'接続失敗: '+e.message,'bad')}
  });
  $('googleDisconnect').addEventListener('click',()=>{FurusatoGoogleDrive.signOut();setStatus($('googleStatus'),'接続を解除しました。','warn')});
  $('googleScan').addEventListener('click',async()=>{
    const s=state();setStatus($('scanStatus'),'検索・解析中…');$('googleScan').disabled=true;
    try{
      const r=await FurusatoGoogleDrive.scanAndImport(s,m=>setStatus($('scanStatus'),m));
      save(s);$('result').textContent=JSON.stringify(r,null,2);
      setStatus($('scanStatus'),`完了：${r.files}件 / 登録・更新 ${r.added}件 / 確認待ち ${r.review}件 / スキップ ${r.skipped}件 / エラー ${r.errors.length}件`,r.errors.length?'warn':'ok');
    }catch(e){$('result').textContent=JSON.stringify({error:String(e),diagnostics:FurusatoGoogleDrive.getRuntimeDiagnostics()},null,2);setStatus($('scanStatus'),'取り込み失敗: '+e.message,'bad')}
    finally{$('googleScan').disabled=!FurusatoGoogleDrive.getClientId()}
  });
  $('exportOcrImage').addEventListener('click',()=>{
    const u=FurusatoGoogleDrive.getLastOcrImageDataUrl();
    if(!u){$('ocrStatus').textContent='保存できるOCR画像がありません。先にPDF取り込みを実行してください。';return}
    const a=document.createElement('a');a.href=u;a.download='furusato_ocr.png';a.click();$('ocrStatus').textContent='OCR画像を保存しました。'
  });
  refresh();
})();
</script></body></html>
