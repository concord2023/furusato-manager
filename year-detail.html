<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>年度別・上限額詳細</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><a href="year-history.html" class="back">← 年度一覧</a><strong id="headTitle">年度別・上限額詳細</strong></div></header><main>
<section class="hero compact"><div class="eyebrow">📁 年度固定</div><h1 id="limit">—</h1><p id="status">—</p></section>
<section class="card"><h2>この年度だけの計算</h2><div id="summary">—</div></section>
<section class="card"><h2>給与明細・賞与</h2><div id="payroll">—</div><p class="note">ここでは選択した年度の保存済み明細だけを使用します。他年度の給与は混ぜません。</p></section>
<section class="card"><h2>手動入力</h2><div class="miniForm"><label>娘の国民年金（この年度に支払った額） <input id="pension" type="number" min="0" step="1"> 円</label><button id="save">この年度を保存して再計算</button></div><p class="note">この金額は選択した年度の社会保険料控除にだけ反映します。</p></section>
<section class="card"><h2>源泉徴収票との関係</h2><div id="withholding">—</div></section>
<nav><a href="year-history.html">年度一覧</a><a id="backYear" href="#">この年度へ戻る</a><a href="settings.html">設定</a></nav></main>
<script src="data-model.js"></script><script src="calculator.js"></script><script src="app.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const q=new URLSearchParams(location.search),y=Number(q.get('year'))||new Date().getFullYear(),yen=n=>new Intl.NumberFormat('ja-JP').format(Math.round(Number(n)||0))+'円',$=id=>document.getElementById(id);
 const r=(state.yearRecords||{})[String(y)]||{year:y,manual:{}}; const a=(state.yearPayrollRecords||{})[String(y)]||{salaryRecords:[],bonusRecords:[]}; const w=r.withholding||null;
 function calc(){if(w)return FurusatoCalculator.historicalCalc(r,r.manual||{});const t=FurusatoModel.clone(state);t.year=y;t.salaryRecords=(a.salaryRecords||[]).filter(x=>x.status==='actual');t.socialRecords=(a.socialRecords||[]).filter(x=>x.status==='actual');t.bonusRecords=(a.bonusRecords||[]).filter(x=>x.status==='actual');t.bonusSocialRecords=t.bonusRecords.filter(x=>x.social!=null).map(x=>({date:x.date,month:x.month,amount:x.social,status:'actual'}));t.forecastSalary=[];t.forecastSocial=[];t.forecastBonus=0;t.yearRecords=t.yearRecords||{};t.yearRecords[String(y)]={...r,manual:r.manual||{}};return FurusatoCalculator.calc(t)}
 function render(){const x=calc();$('headTitle').textContent=`${y}年・上限額詳細`;$('limit').textContent=x?yen(x.estimatedLimit):'—';$('status').innerHTML=w?'<span class="ok">● 源泉徴収票ベース・確定</span>':'<span class="note">○ 月別明細ベース</span>';$('summary').innerHTML=x?`<div class="row"><span>年間給与等</span><strong>${yen(x.employmentGross||x.annualSalary)}</strong></div><div class="row"><span>社会保険料</span><strong>${yen(x.social||x.withholdingSocial)}</strong></div><div class="row"><span>手動国民年金</span><strong>${yen(r.manual?.nationalPension||0)}</strong></div><div class="row"><span>安全目安</span><strong>${yen(x.safe)}</strong></div>`:'データがありません。';const sr=(a.salaryRecords||[]).slice().sort((p,q)=>Number(p.month)-Number(q.month));$('payroll').innerHTML=sr.length?sr.map(v=>`<div class="row"><span>${v.month}月給与</span><strong>${yen(v.taxableGross??v.gross)}</strong></div>`).join(''):'<p class="note">この年度の給与明細はまだ保存されていません。</p>'+(a.bonusRecords||[]).map(v=>`<div class="row"><span>${v.season||'賞与'}</span><strong>${yen(v.amount)}</strong></div>`).join('');$('pension').value=Number(r.manual?.nationalPension)||0;$('withholding').innerHTML=w?`<p>源泉徴収票：${w.document||'保存済み'}</p><p>給与収入 ${yen(w.annualSalary)}／給与所得控除後 ${yen(w.salaryIncomeAfterDeduction)}／社会保険料 ${yen(w.social)}</p><p class="note">源泉徴収票を正（確定）として使用します。月別集計との差はエラーにしません。</p>`:'<p class="note">源泉徴収票がないため、保存済みの月別明細から計算しています。</p>';}
 $('save').onclick=()=>{const n=Math.max(0,Number($('pension').value)||0);state.yearRecords=state.yearRecords||{};state.yearRecords[String(y)]={...(state.yearRecords[String(y)]||{}),year:y,manual:{...((state.yearRecords[String(y)]||{}).manual||{}),nationalPension:n},updatedAt:new Date().toISOString()};save();render()};$('backYear').href=`year-${y}.html`;render();
});
</script></body></html>
