<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.json"><title>ふるさと納税マネージャー</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><strong>ふるさと納税マネージャー</strong><small>2026年</small></div></header><main>
<section class="hero"><div class="eyebrow" id="estimateStatus">🟡 9月時点・推定</div><h1>推定上限額 <span id="limit">—</span></h1><p>今年の実績＋今後の予測から算出。最終確定額ではありません。</p><a class="button" href="details.html">上限額の計算詳細を見る →</a></section>
<div class="grid"><div class="card"><span>確定寄附</span><b id="donated">—</b></div><div class="card"><span>残りの推定目安</span><b id="remaining">—</b></div><div class="card"><span>確認待ち</span><b id="pendingCount">—</b></div></div>
<section class="card"><div class="section-head"><h2>📦 返礼品の配送</h2><a href="donations.html">一覧 →</a></div><div id="homeDelivery"></div></section>
<section class="card"><div class="section-head"><h2>💰 寄附集計</h2><a href="donations.html">詳細 →</a></div><div id="homeDonations"></div></section>
<section class="card"><div class="section-head"><h2>📄 給与・税情報</h2><a href="details.html">内訳 →</a></div><div class="row"><span>今年の給与・賞与年額見込</span><strong id="gross">—</strong></div><div class="row"><span>社会保険料年額見込</span><strong id="social">—</strong></div><div class="row"><span>情報の状態</span><em class="ok">実績＋予測</em></div></section>
<nav><a class="active" href="index.html">ホーム</a><a href="details.html">上限詳細</a><a href="donations.html">寄附・配送</a><a href="settings.html">設定</a></nav></main>
<script src="data-model.js"></script><script src="calculator.js"></script><script src="integration.js"></script><script src="app.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{const yen=n=>new Intl.NumberFormat('ja-JP').format(Math.round(Number(n)||0))+'円';const c=FurusatoCalculator.calc(state),$=id=>document.getElementById(id);$('limit').textContent=yen(c.estimatedLimit);$('donated').textContent=yen(c.donated);$('remaining').textContent=yen(c.remaining);$('pendingCount').textContent=(state.donations||[]).filter(x=>x.status==='確認待ち').length+'件';$('gross').textContent=yen(c.employmentGross);$('social').textContent=yen(c.social);const d=(state.donations||[]);$('homeDelivery').innerHTML=d.filter(x=>x.delivery&&x.delivery!=='未確定').slice(0,4).map(x=>`<div class="row"><span>${x.item}・${x.city}</span><em class="${x.status==='確認待ち'?'':'ok'}">${x.delivery}</em></div>`).join('')||'<p class="note">配送予定はまだありません。</p>';const by={};d.filter(x=>x.status!=='確認待ち'&&x.included!==false).forEach(x=>by[x.site]=(by[x.site]||0)+Number(x.amount||0));$('homeDonations').innerHTML=Object.entries(by).map(([site,n])=>`<div class="row"><span>${site}</span><strong>${yen(n)}</strong></div>`).join('')||'<p class="note">確定した寄附はありません。</p>';});
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js?build=20260920-v16').catch(()=>{});</script></body></html>
